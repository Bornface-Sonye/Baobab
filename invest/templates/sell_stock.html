<!DOCTYPE html>

<html>

<head>

<title>Sell Stocks</title>

<style>

body{

margin:0;
padding:0;
font-family:Arial;
background:#f4f6f9;

}

.container{

width:500px;
margin:auto;
margin-top:50px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 15px rgba(0,0,0,.2);

}

h2{

text-align:center;
color:#1e3a8a;

}

.info{

background:#edf4ff;
padding:15px;
border-radius:10px;
margin-bottom:20px;

}

.form-control{

width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;

}

button{

width:100%;
padding:12px;
border:none;
background:#dc3545;
color:white;
border-radius:5px;
font-size:16px;
cursor:pointer;

}

button:hover{

background:#bb2d3b;

}

.success{

padding:10px;
background:#d1e7dd;
margin-bottom:15px;
border-radius:5px;

}

.error{

padding:10px;
background:#f8d7da;
margin-bottom:15px;
border-radius:5px;

}

</style>

</head>

<body>

<div class="container">

<h2>

Sell Stocks

</h2>


<div class="info">

<p>

Wallet Balance:

Ksh {{wallet.available_balance}}

</p>

</div>


{% if success %}

<div class="success">

{{success}}

</div>

{% endif %}


{% if error %}

<div class="error">

{{error}}

</div>

{% endif %}


<form method="POST">

{% csrf_token %}

{{form.as_p}}

<button type="submit">

Sell Stock

</button>

</form>

</div>

</body>

</html>
