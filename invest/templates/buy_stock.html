{% extends 'base_dashboard.html' %}
{% load static %}

{% block content %}

<h2 style="text-align: center; margin-bottom: 20px;">Buy Stock</h2>

<style>

body{

margin:0;
padding:0;
background:#f3f4f7;
font-family:Arial;

}

.container{

width:500px;
margin:auto;
margin-top:40px;
padding:30px;
background:white;
border-radius:10px;
box-shadow:0px 0px 15px rgba(0,0,0,.2);

}

h2{

text-align:center;
color:#1e3a8a;

}

.info{

padding:15px;
background:#edf4ff;
border-radius:10px;
margin-bottom:20px;

}

.info p{

margin:8px;

}

.form-control{

width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:5px;
box-sizing:border-box;

}

button{

width:100%;
padding:12px;
border:none;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
border-radius:5px;

}

button:hover{

background:#1d4ed8;

}

.success{

padding:10px;
background:#d4edda;
color:#155724;
margin-bottom:15px;
border-radius:5px;

}

.error{

padding:10px;
background:#f8d7da;
color:#721c24;
margin-bottom:15px;
border-radius:5px;

}

</style>

</head>

<body>

<div class="container">

<h2>

Buy Stocks

</h2>


<div class="info">

<p>

Wallet Balance:
Ksh {{wallet.available_balance}}

</p>

</div>


{% if success %}

<div class="success">

{{success}}

</div>

{% endif %}


{% if error %}

<div class="error">

{{error}}

</div>

{% endif %}


<form method="post" style="max-width: 600px; margin: auto; background: #f9f9f9; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    {% csrf_token %}

{{form.as_p}}

<div style="text-align: center; margin-top: 20px;">
    <button type="submit" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Buy Stock
    </button>
</div>

</form>

{% endblock %}
