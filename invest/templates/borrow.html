<!DOCTYPE html>

<html>

<head>

<title>Borrow Money</title>

<style>

body{

margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f5f7fa;

}

.container{

width:500px;
margin:auto;
margin-top:50px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.2);

}

.heading{

text-align:center;
color:#1d3557;
margin-bottom:25px;

}

.card{

background:#eef6ff;
padding:15px;
border-radius:8px;
margin-bottom:20px;

}

.card p{

margin:10px 0;

}

.form-control{

width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;

}

.submit-btn{

width:100%;
padding:12px;
border:none;
background:#0d6efd;
color:white;
font-size:16px;
border-radius:5px;
cursor:pointer;

}

.submit-btn:hover{

background:#084298;

}

.message{

padding:10px;
margin-bottom:15px;
border-radius:5px;
background:#d1e7dd;

}

.errorlist{

color:red;
list-style:none;
padding:0;

}

</style>

</head>

<body>

<div class="container">

<h2 class="heading">
Borrow Money
</h2>


<div class="card">

<p>
<b>Phone:</b>
{{ investor.phone_number }}
</p>

<p>
<b>Wallet Balance:</b>
Ksh {{ wallet.available_balance }}
</p>

<p>
<b>Collateral Balance:</b>
Ksh {{ wallet.collateral_balance }}
</p>

<p>
<b>Current Interest:</b>
{{ interest }}%
</p>

</div>


{% for message in messages %}

<div class="message">

{{message}}

</div>

{% endfor %}


<form method="POST">

{% csrf_token %}

{{form.as_p}}

<button
type="submit"
class="submit-btn">

Borrow Money

</button>

</form>

</div>

</body>

</html>
