{% load static %}
<!doctype html>
<html lang="en">
<head>
    <title>Investing Platform | Login</title>

    <!-- Favicons -->
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <link rel="apple-touch-icon" href="{% static 'img/logo.png' %}">

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{% static 'css/global/style.css' %}">
</head>

<body>

<section class="ftco-section">
    <div class="container">

        <!-- Header -->
        <div class="row justify-content-center">
            <div class="col-md-6 text-center mb-5">
                <h2 class="heading-section">Investing Platform</h2>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-12 col-lg-10">

                <div class="wrap d-md-flex">

                    <!-- LEFT IMAGE PANEL -->
                    <div class="img"
                         style="background-image: url('{% static "img/bg-7.jpg" %}'); position: relative;">
                        <div style="
                            position: absolute;
                            top: 50%;
                            width: 100%;
                            transform: translateY(-50%);
                            color: #fff;
                            font-size: 34px;
                            font-weight: bold;
                            text-align: center;
                            text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
                        ">
                            SMART INVESTING STARTS HERE
                        </div>
                    </div>

                    <!-- LOGIN FORM -->
                    <div class="login-wrap p-4 p-md-5">

                        <div class="d-flex">
                            <div class="w-100">
                                <h3 class="mb-4">Investor Sign In</h3>
                            </div>

                            <div class="w-100">
                                <p class="social-media d-flex justify-content-end">
                                    <a href="#" class="social-icon d-flex align-items-center justify-content-center">
                                        <span class="fa fa-facebook"></span>
                                    </a>
                                    <a href="#" class="social-icon d-flex align-items-center justify-content-center">
                                        <span class="fa fa-twitter"></span>
                                    </a>
                                </p>
                            </div>
                        </div>

                        <!-- FORM -->
                        <form method="post" action="{% url 'login' %}">
                            {% csrf_token %}

                            {% if form.errors %}
                                <div class="alert alert-danger">
                                    Invalid login credentials. Please try again.
                                </div>
                            {% endif %}

                            <!-- Username -->
                            <div class="form-group mb-3">
                                <label class="label">Username / Email</label>
                                {{ form.username }}
                            </div>

                            <!-- Password -->
                            <div class="form-group mb-3">
                                <label class="label">Password</label>
                                {{ form.password }}
                            </div>

                            <!-- Submit -->
                            <div class="form-group">
                                <button type="submit"
                                        class="form-control btn btn-primary rounded submit px-3">
                                    Sign In
                                </button>
                            </div>

                            <!-- Extras -->
                            <div class="form-group d-md-flex">

                                <div class="w-50 text-left">
                                    <label class="checkbox-wrap checkbox-primary mb-0">
                                        Remember Me
                                        <input type="checkbox" checked>
                                        <span class="checkmark"></span>
                                    </label>
                                </div>

                                <div class="w-50 text-md-right">
                                    <a href="{% url 'reset-password' %}">Forgot Password?</a>
                                </div>

                            </div>
                        </form>

                        <!-- SIGNUP -->
                        <p class="text-center">
                            No account?
                            <a href="{% url 'signup' %}">Create one</a>
                        </p>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<!-- JS -->
<script src="{% static 'js/login/jquery.min.js' %}"></script>
<script src="{% static 'js/login/popper.js' %}"></script>
<script src="{% static 'js/login/bootstrap.min.js' %}"></script>
<script src="{% static 'js/login/main.js' %}"></script>

</body>
</html>
