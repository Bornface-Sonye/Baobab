{% extends 'base_dashboard.html' %}
{% load static %}

{% block content %}

<style>

body{

margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f5f7fa;

}

.container{

width:500px;
margin:auto;
margin-top:50px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,0.2);

}

.heading{

text-align:center;
color:#1d3557;
margin-bottom:25px;

}

.card{

background:#eef6ff;
padding:15px;
border-radius:8px;
margin-bottom:20px;

}

.card p{

margin:10px 0;

}

.form-control{

width:100%;
padding:12px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;

}

.submit-btn{

width:100%;
padding:12px;
border:none;
background:#0d6efd;
color:white;
font-size:16px;
border-radius:5px;
cursor:pointer;

}

.submit-btn:hover{

background:#084298;

}

.message{

padding:10px;
margin-bottom:15px;
border-radius:5px;
background:#d1e7dd;

}

.errorlist{

color:red;
list-style:none;
padding:0;

}

</style>

<div class="lend-container">

    <div class="card">

        <h2 style="text-align: center; margin-bottom: 20px;">Borrow Money</h2>

        <p class="description">

            Borrow Money and Invest Later.

        </p>

        {% if messages %}

            {% for message in messages %}

            <div class="message">

                {{message}}

            </div>

            {% endfor %}

        {% endif %}


        <form method="post" style="max-width: 600px; margin: auto; background: #f9f9f9; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            {% csrf_token %}

            <div class="field">

                <label><b>
                    Amount:
                </label></b>

                {{form.amount}}

            </div>

            <div class="field">

                <label>
                    Duration (Days)
                </label>

                {{form.duration_days}}

            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
                    Borrow Money
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
